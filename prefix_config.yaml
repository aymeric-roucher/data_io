# Ordered: First match applies.

# SYNTH
- prefix: "SYNTH__"
  max_per_file: 20_000

# FLAN
# NOTE (local mod): the FLAN translation (wmt16_translate_*) tasks are removed from
# the tokenized pool by remove_flan_translation.sh (~32% of FLAN, near-useless for
# English reasoning/knowledge). Cap raised 5k->15k to keep more of the remaining
# benchmark-relevant FLAN (MCQA / QA / NLI / reading-comprehension).
- prefix: "flan__cot_"
- prefix: "flan__"
  max_per_file: 5_000

# Other clustered datasets
- prefix: "dmmath__"
  max_per_file: 100_000
- prefix: "ampsmathematica__"
  max_per_file: 10_000
- prefix: "tasksource__"
  max_per_file: 10_000
- prefix: "openmathinstruct2__"
  max_per_file: 2_000_000
- prefix: "acereason__"
  max_per_file: 2_000_000
- prefix: "openthoughts2__"
  max_per_file: 500_000
- prefix: "sudoku_extreme__"
  max_per_file: 1_000_000

# Added math (local) — clean_orca_math.py (worked solutions / CoT).
# Big-Math (clean_big_math.py) is intentionally NOT included: it is HARD, answer-only ("direct"),
# which under our response-only objective on a small from-scratch model is unlearnable scaffold-free
# -> memorization, and teaches ~no generative language. See RecursiveModel/README.md "Datamix".
- prefix: "orca_math"
  max_per_file: 200_000   # ~full; easy/GSM8k-level worked solutions — do NOT upsample (easy + overlaps openmathinstruct2)

# Repeat small HQ datasets
- prefix: "Platypus__"
  repeat: 10
- prefix: "omnimath.jsonl"
  repeat: 10
- prefix: "gsm8k_train.jsonl"
  repeat: 10
- prefix: "math_train.jsonl"
  repeat: 10
- prefix: "webinstruct_verified.jsonl"
  repeat: 10
- prefix: "no_robots.jsonl"
  repeat: 10
